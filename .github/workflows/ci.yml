name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  trust_helpers:
    name: Caddy trust helpers (${{ matrix.os }}, ${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: posix
          - os: macos-latest
            engine: posix
          - os: windows-latest
            engine: powershell
          - os: windows-latest
            engine: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up standalone Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Install standalone test dependencies
        run: gem install minitest openssl --no-document

      - name: Verify Unix trust helper contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = macOS ]; then
            if ! openssl_prefix="$(brew --prefix openssl@3)" || [ ! -x "$openssl_prefix/bin/openssl" ]; then
              echo "Missing preinstalled Homebrew openssl@3 CLI" >&2
              exit 1
            fi
            export PATH="$openssl_prefix/bin:$PATH"
          fi
          openssl version
          sh -n bin/trust-caddy
          sh -n install.sh
          ruby test/packaging/caddy_puma.rb
          ruby test/packaging/caddy_trust_posix.rb
          ruby test/packaging/caddy_trust_installers.rb

      - name: Verify native Windows trust helper contracts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CADDY_TEST_POWERSHELL: ${{ matrix.engine }}
        run: |
          ruby test/packaging/caddy_trust_windows.rb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruby test/packaging/caddy_trust_installers.rb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in Ruby dependencies
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y google-chrome-stable curl libjemalloc2 libvips postgresql-client postgresql-client

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
