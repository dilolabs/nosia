name: Flisk files

# The optional Flisk setup (docs/FLISK.md): fail when .autogenerated/docker-compose.yml no longer matches services/**/service.json.
on:
  pull_request:
    paths: ["services/**", ".flisk/**", ".autogenerated/**", ".github/workflows/flisk.yml"]
  push:
    branches: [main]
    paths: ["services/**", ".flisk/**", ".autogenerated/**", ".github/workflows/flisk.yml"]

permissions:
  contents: read

jobs:
  generated-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated Compose is up to date
        run: npx --yes @flisk-sh/flisk-export@0.4.2 compose . --check
      - name: Generated Compose is valid
        run: cp .env.example .env && docker compose --env-file .env -f .autogenerated/docker-compose.yml config --quiet
