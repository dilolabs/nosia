name: Flisk files

# The optional Flisk setup (docs/FLISK.md): fail when .autogenerated/docker-compose.yml no longer matches services/**/service.json.
on:
  pull_request:
    paths: ["docker-compose.yml", "services/**", ".flisk/**", ".autogenerated/**", ".github/workflows/flisk.yml"]
  push:
    branches: [main]
    paths: ["docker-compose.yml", "services/**", ".flisk/**", ".autogenerated/**", ".github/workflows/flisk.yml"]

permissions:
  contents: read

jobs:
  generated-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated Compose is up to date
        run: npx --yes @flisk-sh/flisk-export@0.9.0 compose . --check
      - name: Generated Compose is valid
        run: cp .env.example .env && docker compose --env-file .env -f .autogenerated/docker-compose.yml config --quiet
      - name: service.json files still match docker-compose.yml
        run: |
          npx --yes @flisk-sh/flisk@1.4.28 --version
          FLISK_IMPORT_PACKAGE=flisk-import@0.16.0 npx --yes @flisk-sh/flisk@1.4.28 import . --yes --force
          npx --yes @flisk-sh/flisk-export@0.9.0 compose . --force
          git diff --exit-code -- services .flisk .autogenerated
