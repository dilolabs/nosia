###############################################################################
# GENERATED by `flisk export compose` from the service.json files. DO NOT EDIT.
# Change service.json and run `flisk export compose --force`; CI can run
# `flisk export compose --check` to fail when this file is out of date.
# Flisk is not needed to start it. Compose reads .env from this file's folder,
# so from the project root pass the project's .env:
#   docker compose --env-file .env -f .autogenerated/docker-compose.yml up -d
###############################################################################

name: "nosia"

services:
  db-migrate:
    build:
      context: "../services/nosia/db-migrate"
      dockerfile: "Dockerfile"
    init: true
    restart: "no"
    environment:
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}"
      DATABASE_URL: "${DATABASE_URL}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: "pgvector/pgvector:pg16"
    init: true
    restart: "on-failure:5"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    volumes:
      - "postgres-db-data:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:5432:5432/tcp"
    healthcheck:
      test: ["CMD", "sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: "2s"
      timeout: "5s"
      retries: 30

  reverse-proxy:
    image: "caddy:latest"
    init: true
    restart: "unless-stopped"
    environment:
      NOSIA_URL: "${NOSIA_URL}"
    volumes:
      - "../Caddyfile:/etc/caddy/Caddyfile"
      - "caddy-config:/config"
      - "caddy-data:/data"
    ports:
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:443/tcp"
    depends_on:
      web:
        condition: service_healthy

  solidq:
    build:
      context: "../services/nosia/solidq"
      dockerfile: "Dockerfile"
    init: true
    restart: "on-failure:5"
    environment:
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}"
      AI_API_KEY: "${AI_API_KEY}"
      AI_BASE_URL: "${AI_BASE_URL}"
      AUGMENTED_CONTEXT: "${AUGMENTED_CONTEXT}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP}"
      CHUNK_SIZE: "${CHUNK_SIZE}"
      DATABASE_URL: "${DATABASE_URL}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      GUARD_MODEL: "${GUARD_MODEL}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS}"
      LLM_MODEL: "${LLM_MODEL}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE}"
      LLM_TOP_K: "${LLM_TOP_K}"
      LLM_TOP_P: "${LLM_TOP_P}"
      RETRIEVAL_FETCH_K: "${RETRIEVAL_FETCH_K}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    volumes:
      - "rails-storage:/rails/storage"
    depends_on:
      postgres-db:
        condition: service_healthy
      web:
        condition: service_healthy
    models:
      - "llm"
      - "embedding"

  web:
    image: "dilolabs/nosia:latest"
    init: true
    restart: "on-failure:5"
    environment:
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}"
      AI_API_KEY: "${AI_API_KEY}"
      AI_BASE_URL: "${AI_BASE_URL}"
      AUGMENTED_CONTEXT: "${AUGMENTED_CONTEXT}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP}"
      CHUNK_SIZE: "${CHUNK_SIZE}"
      DATABASE_URL: "${DATABASE_URL}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      GUARD_MODEL: "${GUARD_MODEL}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS}"
      LLM_MODEL: "${LLM_MODEL}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE}"
      LLM_TOP_K: "${LLM_TOP_K}"
      LLM_TOP_P: "${LLM_TOP_P}"
      RETRIEVAL_FETCH_K: "${RETRIEVAL_FETCH_K}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    volumes:
      - "rails-storage:/rails/storage"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: "2s"
      timeout: "5s"
      retries: 30
    models:
      - "llm"
      - "embedding"

models:
  embedding:
    model: "${EMBEDDING_MODEL}"
  llm:
    model: "${LLM_MODEL}"

volumes:
  caddy-config:
    name: "nosia_caddy-config"
  caddy-data:
    name: "nosia_caddy-data"
  postgres-db-data:
    name: "nosia_postgres-db-data"
  rails-storage:
    name: "nosia_rails-storage"
