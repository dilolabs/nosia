---
name: nosia
services:
  rails-app:
    build:
      context: ".."
      dockerfile: ".devcontainer/Dockerfile"
    volumes:
    - "../..:/workspaces:cached"
    command: sleep infinity
    depends_on:
    - postgres
    - selenium
    - redis
  selenium:
    image: seleniarm/standalone-chromium
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4444/status | grep -Eq '\"ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  redis:
    image: redis:7.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
    volumes:
    - redis-data:/data
  postgres:
    image: postgres:16.1
    restart: unless-stopped
    networks:
    - default
    volumes:
    - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\""]
      interval: 30s
      timeout: 5s
volumes:
  postgres-data:
  redis-data:
